name: Test macOS (Windows optional)
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_windows:
        description: Run optional Windows fixture tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.test_windows && '["macos-latest", "windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.402'
      - run: npm ci
      - run: npx playwright install chromium
      - run: python scripts/build.py
      - run: python scripts/windows_app.py --arch x64
        if: runner.os == 'Windows'
      - run: python scripts/windows_app.py --test-model
        if: runner.os == 'Windows'
      - run: npm test
        env:
          TIBO_WINDOWS_APP: '1'
      - run: python scripts/package.py
        if: runner.os != 'Windows'
      - run: python scripts/windows_app.py --arch x64 --package
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: TiboReset-${{ runner.os }}
          path: |
            dist/*.zip
            dist/SHA256SUMS*.txt
          if-no-files-found: error
